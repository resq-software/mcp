#
# Weekly dependency updates, grouped to keep PR noise low.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
    groups:
      github-actions:
        patterns: ["*"]
    labels: [chore, deps]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    # Manifests live in each package, not at the repo root (no root pyproject.toml).
    # Pointing at "/" makes Dependabot's pip job fail every run.
    directories:
      - /packages/resq-mcp
      - /packages/resq-dsa
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
    groups:
      pip:
        patterns: ["*"]
    labels: [chore, deps]
    open-pull-requests-limit: 5
