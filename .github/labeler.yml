# ── Package scope labels ────────────────────────────────────────────────

"pkg:resq-mcp":
  - changed-files:
    - any-glob-to-any-file: packages/resq-mcp/**/*

"pkg:resq-dsa":
  - changed-files:
    - any-glob-to-any-file: packages/resq-dsa/**/*

# ── Area labels ─────────────────────────────────────────────────────────

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/**/*
      - .git-hooks/**/*
      - bootstrap.sh
      - agent-sync.sh
      - flake.nix
      - flake.lock

"A-Build":
  - changed-files:
    - any-glob-to-any-file:
      - packages/*/pyproject.toml
      - packages/*/uv.lock

"A-Docker":
  - changed-files:
    - any-glob-to-any-file: packages/resq-mcp/Dockerfile

# ── Category labels ─────────────────────────────────────────────────────

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*

"C-Testing":
  - changed-files:
    - any-glob-to-any-file: packages/*/tests/**/*