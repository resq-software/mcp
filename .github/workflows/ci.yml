name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
        working-directory: ${{ matrix.dir }}
      - run: uv run ruff check src/ tests/
        working-directory: ${{ matrix.dir }}
      - run: uv run ruff format --check src/ tests/
        working-directory: ${{ matrix.dir }}

  typecheck:
    name: Type Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
        working-directory: ${{ matrix.dir }}
      - run: uv run mypy src/
        working-directory: ${{ matrix.dir }}

  docstrings:
    # Public API surface in src/ must carry docstrings. interrogate
    # threshold is configured per-package in [tool.interrogate]
    # in each pyproject.toml; raise the floor over time as gaps
    # are filled.
    name: Docstring Coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uvx interrogate --config pyproject.toml src/
        working-directory: ${{ matrix.dir }}

  test:
    name: Test (${{ matrix.name }} / ${{ matrix.python-version }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [resq-mcp, resq-dsa]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
            cov: --cov=src --cov-report=xml
          - name: resq-dsa
            dir: packages/resq-dsa
            cov: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
        working-directory: ${{ matrix.dir }}
      - run: uv run pytest tests/ -v ${{ matrix.cov }}
        working-directory: ${{ matrix.dir }}

  build:
    name: Build (${{ matrix.name }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
        working-directory: ${{ matrix.dir }}

  # Org template/standards conformance (LICENSE, README, no leftover placeholders).
  repo-standards:
    name: Repo standards
    permissions:
      contents: read
    uses: resq-software/.github/.github/workflows/repo-standards.yml@68705d8093f4a0d246573288f7225aefb1c85042

  # Single status-check context consumed by the org ruleset default-branch-baseline.
  # Replaces the former placeholder required.yml: now gates on the repo's real CI
  # (lint/typecheck/docstrings/test/build) + repo-standards. Security runs in
  # security.yml (PR + weekly). Aggregates so `required` is green only when all pass.
  required:
    name: required
    needs: [lint, typecheck, docstrings, test, build, repo-standards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::error::one or more required jobs failed"; exit 1
          fi
