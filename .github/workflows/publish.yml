name: Release

# Manual-only trigger.
#
# `python-semantic-release` needs to push the version-bump commit and
# tag back to `main`. The `default-branch-baseline` ruleset on this
# repo requires every change to `main` to come through a pull request
# (bypass mode is `pull_request`, so even bypass actors must use a PR).
# Direct pushes from the Actions GITHUB_TOKEN — including the bot's
# release commit — are rejected with `GH013: Repository rule
# violations`. Keeping `push: branches: [main]` on this trigger
# therefore caused every commit to fail the `Release` workflow.
#
# Options for restoring automatic releases on push:
#   1. Add a dedicated GitHub App / `resq-sw` PAT to `bypass_actors` on
#      ruleset 15191038 with `bypass_mode: always`, then wire its token
#      into `mcp-release` / `dsa-release` checkouts and the
#      `python-semantic-release` action.
#   2. Restructure to a PR-based release flow: run semantic-release
#      with `commit: false, push: false` to compute the version, then
#      open a release PR via `peter-evans/create-pull-request` so the
#      bump merges through the protected-branch policy normally.
#
# Until one of those lands, dispatch this workflow manually from the
# Actions tab (or via `gh workflow run Release.yml`) when you want to
# cut a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ━━━ resq-mcp ━━━

  mcp-release:
    name: "mcp: Semantic Release"
    runs-on: ubuntu-latest
    concurrency: release-mcp
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: packages/resq-mcp

  mcp-build:
    name: "mcp: Build"
    needs: mcp-release
    if: needs.mcp-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.mcp-release.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - run: uv sync
        working-directory: packages/resq-mcp
      - run: uv build
        working-directory: packages/resq-mcp
      - run: uv run twine check dist/*
        working-directory: packages/resq-mcp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-dist
          path: packages/resq-mcp/dist/

  mcp-attest:
    name: "mcp: Attestation"
    needs: [mcp-release, mcp-build]
    if: needs.mcp-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-dist
          path: dist/

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*

  mcp-publish:
    name: "mcp: Publish to PyPI"
    needs: [mcp-release, mcp-build, mcp-attest]
    if: needs.mcp-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  mcp-docker:
    name: "mcp: Docker"
    needs: [mcp-release, mcp-publish]
    if: needs.mcp-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.mcp-release.outputs.tag }}
          persist-credentials: false

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: packages/resq-mcp
          file: packages/resq-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/resq-software/mcp:latest
            ghcr.io/resq-software/mcp:${{ needs.mcp-release.outputs.version }}

  # ━━━ resq-dsa ━━━

  dsa-release:
    name: "dsa: Semantic Release"
    runs-on: ubuntu-latest
    concurrency: release-dsa
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: packages/resq-dsa

  dsa-build:
    name: "dsa: Build"
    needs: dsa-release
    if: needs.dsa-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.dsa-release.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - run: uv build
        working-directory: packages/resq-dsa

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsa-dist
          path: packages/resq-dsa/dist/

  dsa-attest:
    name: "dsa: Attestation"
    needs: [dsa-release, dsa-build]
    if: needs.dsa-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dsa-dist
          path: dist/

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*

  dsa-publish:
    name: "dsa: Publish to PyPI"
    needs: [dsa-release, dsa-build, dsa-attest]
    if: needs.dsa-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dsa-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
